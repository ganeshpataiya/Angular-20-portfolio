    <div class="color-boxed">
    <a (click)="setBackground('green')"  class="tr green" >Green</a>
    <a (click)="setBackground('red')" class="tr red">Red</a>   
    <a (click)="setBackground('orange')" class="tr orange">orange</a>
     <a (click)="setBackground('blue')" class="tr blue">Blue</a>
    </div>
  </div>

  <h3 class="text-2xl font-bold mb-4">Three Dimensional Shapes</h3>
  <button (click)="showDiv('video1')" class="text-white text-sm px-5 py-2.5 text-center me-2 mb-2"> Earth Lines Sphere</button>
  <button (click)="showDiv('video2')" class="text-white text-sm px-5 py-2.5 text-center me-2 mb-2">3D Abstract Ball</button>
  <button (click)="showDiv('video3')" class="text-white text-sm px-5 py-2.5 text-center me-2 mb-2">Water Waves</button>
